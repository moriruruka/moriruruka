name: stats

# Regenerates assets/stats.svg from the live GitHub numbers (repos / stars / languages).
#
# Manual only: GitHub records scheduled (cron) runs as github-actions[bot], and this
# repository must not carry any bot attribution. For a fixed twice-monthly refresh,
# run the local script `tools/update_stats.py` from Windows Task Scheduler instead
# (see the notes in that file). Manual runs here are performed by the owner.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/gen_stats.py --user moriruruka --out assets/stats.svg

      - name: Commit if it changed
        run: |
          git config user.name "Aria_Luna"
          git config user.email "80839392+moriruruka@users.noreply.github.com"
          if git diff --quiet -- assets/stats.svg; then
            echo "stats unchanged, nothing to commit"
            exit 0
          fi
          git add assets/stats.svg
          git commit -m "chore: refresh stats card"
          git push
