name: refresh stats

on:
  schedule:
    - cron: "17 3 * * *" # daily 11:17 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/gen_stats.py --user moriruruka --out assets/stats.svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "stats card unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore(stats): refresh stats card"
          git push
